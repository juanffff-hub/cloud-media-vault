name: Arquitectura y pruebas

on:
  push:
    branches: [main, fajardo-cloud-vault, neira-cloud-vault, gomez-cloud-vault, juanda-cloud-vault]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vault_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: cloud_media_vault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vault_test -d cloud_media_vault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vault_test:local_ci_only@127.0.0.1:5432/cloud_media_vault_test
      TEST_DIRECT_URL: postgresql://vault_test:local_ci_only@127.0.0.1:5432/cloud_media_vault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:validate -w server
      - run: npm run check
      - run: npm run test:db -w server
